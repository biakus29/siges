# Blueprint Render — Aurel School SIGES (Docker, offre gratuite).
# La base MySQL est externe (ex. Aiven) : renseignez les variables MYSQL_*
# à la création, et déposez le certificat CA du fournisseur en « Secret File »
# nommé ca.pem (monté dans /etc/secrets/ca.pem).
services:
  - type: web
    name: siges
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: SIGES_SECRET
        generateValue: true
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        value: aurel_school
      - key: MYSQL_SSL_CA
        value: /etc/secrets/ca.pem
